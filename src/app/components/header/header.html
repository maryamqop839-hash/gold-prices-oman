<header class="sticky top-0 z-50 px-3 pt-3">
  <div class="max-w-6xl mx-auto flex items-center justify-between gap-3 px-4 py-2.5
              rounded-2xl border border-black/5 dark:border-white/10
              bg-white/70 dark:bg-ink-800/70 backdrop-blur-xl
              shadow-lg shadow-black/5">

    <!-- الشعار -->
    <a href="#top" class="flex items-center gap-2.5 shrink-0">
      <span class="grid place-items-center w-9 h-9 rounded-xl font-black text-ink-900
                   bg-linear-to-br from-gold-300 to-gold-600 shadow-md">Au</span>
      <span class="hidden sm:inline text-lg font-extrabold text-gold">{{ i18n.t('brand') }}</span>
    </a>

    <!-- الروابط -->
    <nav class="flex items-center gap-1 text-sm md:text-base font-medium">
      <a href="#prices"
         class="px-3 py-1.5 rounded-full text-ink-700 dark:text-gray-200 hover:bg-gold-500/15 transition">
        {{ i18n.t('nav.prices') }}
      </a>
      <a href="#calculator"
         class="px-3 py-1.5 rounded-full text-ink-700 dark:text-gray-200 hover:bg-gold-500/15 transition">
        {{ i18n.t('nav.calculator') }}
      </a>
      <a href="#chart"
         class="px-3 py-1.5 rounded-full text-ink-700 dark:text-gray-200 hover:bg-gold-500/15 transition">
        {{ i18n.t('nav.chart') }}
      </a>
    </nav>

    <!-- الأدوات -->
    <div class="flex items-center gap-2 shrink-0">
      <span class="hidden lg:inline-flex px-3 py-1 rounded-full text-xs font-semibold
                   bg-gold-500/15 text-gold-700 dark:text-gold-300 border border-gold-500/30">
        {{ i18n.t('badge.demo') }}
      </span>

      <!-- زر اللغة -->
      <button (click)="i18n.toggle()"
              class="h-9 px-3 rounded-full text-sm font-bold
                     border border-gold-500/40 text-gold-700 dark:text-gold-300
                     hover:bg-gold-500/15 transition">
        {{ i18n.lang() === 'ar' ? 'EN' : 'عربي' }}
      </button>

      <!-- زر الثيم -->
      <button (click)="theme.toggle()" aria-label="Toggle theme"
              class="grid place-items-center w-9 h-9 rounded-full
                     bg-linear-to-br from-gold-300 to-gold-600 text-ink-900
                     shadow-md hover:scale-105 transition">
        @if (theme.theme() === 'dark') {
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
          </svg>
        } @else {
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
          </svg>
        }
      </button>
    </div>
  </div>
</header>
