<section id="prices" class="max-w-6xl mx-auto px-4 py-12">
  <h2 class="text-2xl md:text-3xl font-bold text-gray-800 mb-2">أسعار الذهب اليوم</h2>
  <p class="text-gray-600 mb-8">أسعار الغرام الواحد حسب العيار بالريال العُماني.</p>

  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
    @for (item of prices; track item.karat) {
      <app-price-card [data]="item"></app-price-card>
    }
  </div>
</section>
