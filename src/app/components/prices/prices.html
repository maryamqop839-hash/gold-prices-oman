<section id="prices" class="max-w-6xl mx-auto px-4 py-16">

  <div class="mb-10">
    <h2 class="text-3xl md:text-4xl font-black text-gold mb-3">
      {{ i18n.t('prices.title') }}
    </h2>
    <div class="w-16 h-1 rounded-full bg-linear-to-r from-gold-300 to-gold-600 mb-4"></div>
    <p class="text-ink-700/70 dark:text-gray-400">{{ i18n.t('prices.desc') }}</p>
  </div>

  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5">
    @for (item of prices; track item.karat) {
      <app-price-card [data]="item" [featured]="item.karat === 24"></app-price-card>
    }
  </div>
</section>
