<div class="relative h-full rounded-3xl p-px transition duration-300 hover:-translate-y-1"
     [class]="featured()
       ? 'bg-linear-to-br from-gold-300 via-gold-500 to-gold-700 shadow-xl shadow-gold-500/30'
       : 'bg-black/5 dark:bg-white/10 hover:bg-gold-500/40'">

  <div class="h-full rounded-[23px] p-6 bg-white dark:bg-ink-800">

    <!-- العيار + الشارة -->
    <div class="flex items-center justify-between mb-5">
      <span class="font-bold text-ink-700 dark:text-gray-200">
        {{ i18n.t('prices.karat') }} {{ data().karat }}
      </span>

      @if (featured()) {
        <span class="px-2.5 py-0.5 rounded-full text-xs font-bold text-ink-900
                     bg-linear-to-br from-gold-300 to-gold-600">
          {{ i18n.t('prices.best') }}
        </span>
      }
    </div>

    <!-- السعر -->
    <p class="text-4xl font-black text-ink-900 dark:text-white" dir="ltr">
      {{ data().price | number: '1.3-3' }}
    </p>
    <p class="mt-1 text-sm text-ink-700/60 dark:text-gray-400">
      {{ i18n.t('unit.omr') }} · {{ i18n.t('hero.perGram') }}
    </p>

    <!-- شريط النقاء -->
    <div class="mt-6">
      <div class="flex justify-between text-xs mb-1.5 text-ink-700/60 dark:text-gray-400">
        <span>{{ i18n.t('prices.purity') }}</span>
        <span dir="ltr">{{ purity() | number: '1.0-1' }}%</span>
      </div>
      <div class="h-2 rounded-full bg-black/5 dark:bg-white/10 overflow-hidden">
        <div class="h-full rounded-full bg-linear-to-r from-gold-300 to-gold-600"
             [style.width.%]="purity()"></div>
      </div>
    </div>
  </div>
</div>
